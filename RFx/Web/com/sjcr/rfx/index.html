        function UpdateCharity()
        {
            $.cordys.ajax({
                method: "RACACharity",
                namespace: "http://schemas.cordys.com/default",
                parameters: {
                    Type: "Update",
                    Name:$("#AssociationName").val(),
                    CharityType:$("#CharityType").val(),
                    Email:$("#CharityEmail").val(),
                    URL:$("#CharityURl").val(),
                    WorkFiled:$("#CharityWork").val(),
                    Address:$("#CharityAddress").val(),
                    LincenAutherity:$("#LicenceAuth").val(),
                    id:CharityID,
                    itemid:CharityItemID
                },
                dataType: "* json",
                async: false,
                success: function(e) {
                 CallRequest();
                    UploadFile();
                },
				error: function(e){
					//$.notify("Error completing task. Please contact administrator.", "error");
					return false;
				}
            });
        }
        function CallRequest()
        {
            $.cordys.ajax({
                method: "RACAReqInformation",
                namespace: "http://schemas.cordys.com/default",
                parameters: {
                    Name: $("#RequesterName").val(),
                    position:$("#RequesterPosition").val(),
                    Email:$("#RequesterEmail").val(),
                    Phone:$("#RequesterPhone").val(),
                    Desc:$("#RequestDesc").val(),
                    extra1:CharityID,
                    extra2:CharityItemID
                },
                dataType: "* json",
                async: false,
                success: function(e) {
                    $("#SubmitBtn").hide();
                   $("#PreviousBtn").hide();

                },

form.append("name", "file1");

};

$.ajax(settings).done(function (response) {

});
