    <script>
	var StateNo;
    var Charity="0";
        var CharityID="";
        var CharityItemID="";
        var LoGoUrl="";
        var RefID;
        var SuppID;
	
        $("#SubmitBtn").on("click", function(e){
            Validation=true;
            if($("#CardNo").val()=="")
                {
                 alert("Please enter Card No");   
                    Validation=false;
                    return;
                }
            if($("#CVVNo").val()=="")
                {
                 alert("Please enter CVV Number");   
                    Validation=false;
                    return;
                }
            
            if(Validation){
                CallRequest(); 
            }
            
        });
        function UpdateCharity()
        {
            $.cordys.ajax({
                method: "RACACharity",
                namespace: "http://schemas.cordys.com/default",
                parameters: {
                    Type: "Update",
                    Name:$("#AssociationName").val(),
                    CharityType:$("#CharityType").val(),
                    Email:$("#CharityEmail").val(),
                    URL:$("#CharityURl").val(),
                    WorkFiled:$("#CharityWork").val(),
                    Address:$("#CharityAddress").val(),
                    LincenAutherity:$("#LicenceAuth").val(),
                    id:CharityID,
                    itemid:CharityItemID
                },
                dataType: "* json",
                async: false,
                success: function(e) {
                 CallRequest();
                },
				error: function(e){
					//$.notify("Error completing task. Please contact administrator.", "error");
					return false;
				}
            });
        }
        function CallRequest()
        {
            $.cordys.ajax({
                method: "CreatePayment",
                namespace: "http://schemas.cordys.com/default",
                parameters: {
                    RFP: RefID,
                    Sup:SuppID,
                    CARD:$("#CardNo").val(),
                    Month:$("#ExpiryMonth").val(),
                    Year:$("#ExpiryYear").val(),
                    CVV:$("#CVVNo").val()
                },
                dataType: "* json",
                async: false,
                success: function(e) {
                    $("#SubmitBtn").hide();
                  // $("#PreviousBtn").hide();
                    alert("Request Created Sucessfuly");
                 
                },
				error: function(e){
					//$.notify("Error completing task. Please contact administrator.", "error");
					return false;
				}
            });
        }
        function GetData()
        {
            $.cordys.ajax({
                method: "GetData",
                namespace: "http://schemas.cordys.com/default",
                parameters: {
                    RefID: RefID,
                    Supp:SuppID
                },
                dataType: "* json",
                async: false,
                success: function(e) {
                   debugger;

                   $("#RFPNo").val(e.RefData.text);
                   $("#NameVal").val(e.Refname.text);
                   $("#SuppCode").val(e.SuppData.text);
$("#Tamt").val(e.Amount.text);
                 
                },
				error: function(e){
					//$.notify("Error completing task. Please contact administrator.", "error");
					return false;
				}
            });
        }
	$(document).ready(function(){
         if(!$.cordys.authentication.sso.isAuthenticated()) {$.cordys.authentication.login();}   
         StateNo="1";

         RefID= window.location.href.split(";")[0].split("=")[1];
         SuppID= window.location.href.split(";")[1].split("=")[1];
         GetData();
         });
     
    </script>
