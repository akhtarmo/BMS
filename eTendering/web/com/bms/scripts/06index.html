<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clarifications Dashboard | Al Jazeera Supplier Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="https://www.aljazeera.com/favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,600&display=swap">
  <link rel="stylesheet" href="../css/06styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "chart.js": "https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"
      }
    }
  </script>
</head>
<body>
  <header class="ajz-header">
    <div class="ajz-container">
      <img src="https://www.aljazeera.com/images/logo.png" alt="Al Jazeera" class="ajz-logo">
      <span class="ajz-title">Clarifications Dashboard</span>
      <nav class="ajz-nav">
        <a href="#" class="ajz-nav-link">Home</a>
        <a href="#" class="ajz-nav-link">Tenders</a>
        <a href="#" class="ajz-nav-link active">Clarifications</a>
        <a href="#" class="ajz-nav-link">Account</a>
      </nav>
    </div>
  </header>
  <main class="ajz-main">
    <section class="ajz-filters">
      <div class="ajz-filter-group">
        <label>Event Name</label>
        <select id="filter-event">
          <option>All Events</option>
          <option>Newsroom Equipment 2024</option>
          <option>Broadcast Software Renewal</option>
        </select>
      </div>
      <div class="ajz-filter-group">
        <label>Status</label>
        <select id="filter-status">
          <option>All Statuses</option>
          <option>Open</option>
          <option>Responded</option>
          <option>Closed</option>
        </select>
      </div>
      <div class="ajz-filter-group">
        <label>Date Range</label>
        <input type="date" id="filter-date-start">
        <span>–</span>
        <input type="date" id="filter-date-end">
      </div>
      <div class="ajz-filter-group">
        <label>Buyer Contact</label>
        <select id="filter-buyer">
          <option>All</option>
          <option>Ahmed Salim</option>
          <option>Fatima Darwish</option>
        </select>
      </div>
      <div class="ajz-filter-actions">
        <button class="ajz-btn ajz-gold" id="clear-filters">Clear</button>
        <label class="ajz-toggle">
          <input type="checkbox" id="only-pending-toggle">
          <span>Show Only Pending Threads</span>
        </label>
      </div>
    </section>

    <section class="ajz-widgets">
      <div class="ajz-widget-row">
        <!-- Clarifications Resolved KPI Tile -->
        <div class="ajz-kpi-tile" id="resolved-kpi-tile">
          <div>
            <span class="ajz-kpi-label">Clarifications Resolved</span>
            <div class="ajz-kpi-value" id="kpi-closed-count">48</div>
          </div>
          <div class="ajz-kpi-trend" id="kpi-trend-indicator">
            <svg width="24" height="24" viewBox="0 0 24 24" class="ajz-kpi-trend-svg" fill="none">
              <path d="M12 6L16 10H13V18H11V10H8L12 6Z" fill="#4CAF50"/>
            </svg>
            <span id="kpi-trend-text">+3.5% vs last month</span>
          </div>
          <!-- Mini inline bar chart -->
          <div class="ajz-kpi-mini-chart-container">
            <canvas id="clar-kpi-mini-bar" width="220" height="45" aria-label="Resolved clarifications per event"></canvas>
          </div>
        </div>

        <!-- Pending Responses/Alert Panel -->
        <div class="ajz-widget ajz-pending-alert">
          <div class="ajz-widget-header">
            <span class="ajz-widget-title">Pending Responses from Supplier</span>
            <span class="ajz-status-tag ajz-status-red">ALERT</span>
          </div>
          <div class="ajz-alert-list" id="pending-list">
            <!-- JS renders pending response items here -->
          </div>
        </div>
      </div>

      <div class="ajz-widget-row ajz-main-content-row">
        <!-- My Clarification Threads List -->
        <div class="ajz-widget ajz-clar-thread-list">
          <div class="ajz-widget-header">
            <span class="ajz-widget-title">My Clarification Threads</span>
            <button class="ajz-btn ajz-outline" id="download-pdf-btn">
              <svg height="18" viewBox="0 0 24 24" width="18" fill="none" style="vertical-align: middle;"><path d="M5 20h14v-2H5v2zm7-18v10.59l4.3-4.29 1.4 1.42-7 7-7-7 1.4-1.42L11 12.59V2h2z" fill="#C9A14A"/></svg>
              Download Clarification History (PDF)
            </button>
          </div>
          <div class="ajz-thread-table-container">
            <table class="ajz-thread-table" id="clar-thread-table">
              <thead>
                <tr>
                  <th>Event Name</th>
                  <th>Last Message</th>
                  <th>Status</th>
                  <th>Days Since Last Activity</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <!-- JS renders threads here -->
              </tbody>
            </table>
          </div>
        </div>

        <div class="ajz-side-widgets">
          <!-- Recent Replies from Buyer (Message Feed) -->
          <div class="ajz-widget ajz-buyer-feed">
            <div class="ajz-widget-header">
              <span class="ajz-widget-title">Recent Replies from Buyer</span>
            </div>
            <ul class="ajz-feed-list" id="buyer-reply-feed">
              <!-- JS renders feed items here -->
            </ul>
          </div>
          <!-- Clarifications by Tender (Bar Chart) -->
          <div class="ajz-widget ajz-bar-chart-widget">
            <div class="ajz-widget-header">
              <span class="ajz-widget-title">Clarifications by Tender</span>
              <select id="bar-chart-filter" class="ajz-bar-chart-filter">
                <option value="all">All Categories</option>
                <option value="equipment">Equipment</option>
                <option value="software">Software</option>
                <option value="services">Services</option>
              </select>
            </div>
            <canvas id="clar-bar-chart" height="170"></canvas>
          </div>
        </div>
      </div>
    </section>

    <!-- Modal for Quick Reply, collapsible thread view -->
    <div class="ajz-modal" id="reply-modal" tabindex="-1" aria-hidden="true">
      <div class="ajz-modal-content">
        <button class="ajz-modal-close" id="modal-close">&times;</button>
        <div id="modal-thread-header"></div>
        <div class="ajz-collapsible-messages" id="modal-thread-messages">
          <!-- JS renders full thread view here -->
        </div>
        <textarea id="modal-reply-input" placeholder="Type your reply..."></textarea>
        <div class="ajz-modal-actions">
          <button class="ajz-btn ajz-gold" id="modal-send-reply">Send Reply</button>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="../scripts/06dashboard.js"></script>
</body>
</html>
