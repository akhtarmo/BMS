<script>
  function getRndInteger(min, max) {
      return Math.floor(Math.random() * (max - min + 1) ) + min;
  }

  <script>
    var riskData = [
      [0, 0, 4], [0, 1, 2], [0, 2, 1], [0, 3, 3],  // Risk values for different cells
      [1, 0, 3], [1, 1, 1], [1, 2, 2], [1, 3, 4],

      [3, 0, 1], [3, 1, 4], [3, 2, 3], [3, 3, 2]
    ];
  
    var riskChart = Highcharts.chart('container-riskheatmap', {
      chart: {
        type: 'heatmap',
        height: 200,
        
      },
      title: {
        text: 'Risk Heatmap'
      },
      exporting: {
        enabled: false
      },
      credits: {
        enabled: false
      },
      xAxis: {
        categories: ['Category 1', 'Category 2', 'Category 3', 'Category 4'],
        title: {
          text: null
        }
      },
      yAxis: {
        categories: ['Risk 1', 'Risk 2', 'Risk 3', 'Risk 4'],
        title: {
          text: null
        }
      },
      colorAxis: {
        min: 1,  // Minimum risk value
        max: 4,  // Maximum risk value
        stops: [
          [0, '#00FF00'],  // Green color for lowest risk
          [0.5, '#FFFF00'],  // Yellow color for moderate risk
          [1, '#FF0000']  // Red color for highest risk
        ],
        labels: {
          format: '{value}'  // Display risk values on color axis
        }
      },
      series: [{
        data: riskData,
        borderWidth: 1,
        dataLabels: {
          enabled: true,
          color: '#000000'
        }
      }],
      legend: {
        align: 'right',
        verticalAlign: 'middle'
      },
      tooltip: {
        formatter: function() {
          return 'Risk: ' + this.y + '<br>' +
                 'Category: ' + this.x + '<br>' +
                 'Value: ' + this.point.value;
        }
      }
    });
  </script>
